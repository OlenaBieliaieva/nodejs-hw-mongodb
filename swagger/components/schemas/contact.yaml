type: object
required:
  - name
  - phoneNumber
properties:
  _id:
    description: Contact's id
    type: string
    example: 66925fd6bee818e7caeacf88
  name:
    description: Contact's name
    type: string
    example: 'John Johnson'
  phoneNumber:
    description: Contact's phone number
    type: string
    example: '0500000000'
  email:
    description: Contact's email
    type: string
    example: 'example@mail.com'
  isFavourite:
    description: 'Whether contact is favourite'
    type: boolean
    example: false
  contactType:
    description: Contact's type
    type: string
    enum: ['work', 'home', 'personal']
    example: 'personal'
  userId:
    description: Contact's user id
    type: string
    example: 66925fd6bee818e7caeacf88
  photo:
    description: Link to contact's photo
    type: string
    example: <https://res.cloudinary.com/dog0evq1e/image/upload/v1720868879/crrqhcilcd9oxpddunjv.jpg>
